<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .gradient1 {
                height: 100px;
                background: linear-gradient(to bottom right, #3498db, #2ecc71);
                color: white;
                padding: 20px;
            }
            .gradient2 {
                height: 100px;
                background: linear-gradient(to right, red, yellow, green);
                color: white;
                padding: 20px;
                margin-top: 10px;
            }
            .photo {
                height: 200px;
                background-image: url("hero.png");
                background-size: contain;
                background-position: center;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="gradient1">To bottom right gradient</div>
        <div class="gradient2">Top to bottom gradient</div>
        <div class="photo"></div>
    </body>
</html>
