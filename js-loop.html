<!DOCTYPE html>
<html lang="en">
<head>

    <title>Loop Practice</title>
</head>
<body>
    <h1>JavaScript Loop</h1>

    <script>
        for (let i = 0; i <= 10; i++) {
            console.log(i);
        }

        for (let i = 1; i <=5; i++) {
            console.log("Hello Hasibur");
        }

        for (let i = 1; i <= 7; i++) {
            console.log("I am learning JavaScript")
        }
    </script>
</body>
