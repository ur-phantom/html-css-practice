<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Practice</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .app {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-top: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        #taskInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2c80b4;
        }
        #message {
            color: red;
            min-height: 1.2rem;
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        li button {
            background-color: #e74c3c;
        }
        li button:hover {
            background-color: #c0392b;
        }
        #counter {
            color: gray;
            text-align: center;
        }
        .done {
            text-decoration: line-through;
            color: gray;
        }

        span {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>To-do</h1>
        <div class="input-row">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addBtn">Add</button>
        </div>
        <p id="message"></p>

        <div class="filter">
            <button id="allBtn">All</button>
            <button id="activeBtn">Active</button>
            <button id="completedBtn">Completed</button>
        </div>

        <ul id="taskList"></ul>
        <p id="counter"></p>
    </div>

    <script>
        const taskInput = document.querySelector("#taskInput");
        const addBtn = document.querySelector("#addBtn");
        const message = document.querySelector("#message");
        const taskList = document.querySelector("#taskList");
        const counter = document.querySelector("#counter");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        let filter = "all";

        document.querySelector("#allBtn").addEventListener("click", function () {
            filter = "all";
            renderTasks();
        });
        document.querySelector("#activeBtn").addEventListener("click", function () {
            filter = "active";
            renderTasks();
        });
        document.querySelector("#completedBtn").addEventListener("click", function () {
            filter = "completed";
            renderTasks();
        });

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function updateCounter() {
            let remaining = 0;

            for (let i = 0; i < tasks.length; i++) {
                if (!tasks[i].done) {
                    remaining++;
                }
            }

            if (remaining === 1) {
                counter.textContent = "1 task left";
            } else {
                counter.textContent = remaining + " tasks left";
            }
        }

        function renderTasks() {
            taskList.innerHTML = "";

            for (let i = 0; i < tasks.length; i++) {

                if (filter === "active" && tasks[i].done) {
                    continue;
                }
                if (filter === "completed" && !tasks[i].done) {
                    continue;
                }

                const li = document.createElement("li");
                const span = document.createElement("span");
                span.textContent = tasks[i].text;

                if (tasks[i].done) {
                    span.classList.add("done");
                }

                span.addEventListener("click", function () {
                    tasks[i].done = !tasks[i].done;
                    saveTasks();
                    renderTasks();
                });

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "x";

                deleteBtn.addEventListener("click", function () {
                    tasks.splice(i, 1);
                    saveTasks();
                    renderTasks();
                });

                li.appendChild(span);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            }

            updateCounter();
        }

        function addTask() {
            const task = taskInput.value.trim();

            if (task === "") {
                message.textContent = "Please write something";
            } else {
                message.textContent = "";
                tasks.push({ text: task, done: false });
                saveTasks();
                renderTasks();
                taskInput.value = "";
            }
        }
        addBtn.addEventListener("click", addTask);

        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask();
            }
        });

        renderTasks();
    </script>
</body>

</html>
