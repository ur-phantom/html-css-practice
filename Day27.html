<!DOCTYPE html>
<html>
    <head>
        <title>Day 27 - Pseudo Elements</title>

        <style>
            body {
                font-family: Arial;
                background-color: #f2f2f2;
                text-align: center;
                padding: 50px;
            }

            h1::before {
                content: "✨";
            }

            h1::after {
                content: "💻";
            }

            h2::before {
                content: "";
                display: inline-block;
                width: 70px;
                height: 5px;
                background-color: black;
                margin-right: 15px;
                vertical-align: middle;
            }

            h2::after {
                content: "";
                display: inline-block;
                width: 70px;
                height: 5px;
                background-color: black;
                margin-left: 15px;
                vertical-align: middle;
            }

            p::before {
                content: "";
                display: inline-block;
                width: 40px;
                height: 5px;
                background-color: black;
                margin-right: 10px;
                vertical-align: middle;
            }

            p::after {
                content: "";
                display: inline-block;
                width: 40px;
                height: 5px;
                background-color: black;
                margin-left: 10px;
                vertical-align: middle;
            }
        </style>
    </head>

    <body>
        <h1>Web Developer</h1>

        <h2>My Skills</h2>

        <p>HTML • CSS • JavaScript • Math</p>
    </body>
</html>
