<!DOCTYPE html>
<html>
<head>
  <title>Day 18 - Responsive Design</title>

  <style>
    body {
      font-family: Arial;
      background-color: #f2f2f2;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .card {
      background-color: white;
      border: 2px solid black;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
    }

    /* Mobile */
    @media (max-width: 600px) {

      .container {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;

        .card {
            padding: 20px;
        }
      }

    }
  </style>
</head>

<body>

  <h1>My Skills</h1>

  <div class="container">

    <div class="card">
      <h2>HTML</h2>
      <p>Web Structure</p>
    </div>

    <div class="card">
      <h2>CSS</h2>
      <p>Web Design</p>
    </div>

    <div class="card">
      <h2>JavaScript</h2>
      <p>Web Function</p>
    </div>

  </div>

</body>
</html>
