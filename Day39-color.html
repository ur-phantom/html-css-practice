<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Color Practice</title>
        <style>
            .box1 {
                background-color: red;
            }
            .box2 {
                background-color: #33c0b1;
            }
            .box3 {
                background-color: rgb(46, 204, 113);
            }
            .box4 {
                background-color: rgba(231, 76, 60, 0.9);
            }
            .box {
                width: 120px;
                height: 120px;
                border-radius: 15px;
                padding: 20px;
                box-sizing: border-box;
                color: white;
            }
        </style>
    </head>

    <body>
        <div class="box box1">Name color</div>
        <div class="box box2">Hex color</div>
        <div class="box box3">RGB color</div>
        <div class="box box4">RGBA color</div>
    </body>
</html>
