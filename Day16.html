<!DOCTYPE html>
<html>
    <head>
        <title>Day 16 - Responsive Design</title>
        <style>
            body {
                font-family: Arial;
                background-color: #f2f2f2;
            }
            h1 {
                text-align: center;
            }
            .container {
                display: grid;
                grid-template-columns: repeat(auto-fit,minmax(200px, 1fr));
                gap: 20px;
            }
            .card {
                background-color: lightblue;
                padding: 30px;
                text-align: center;
                border-radius: 15px;
                font-size: 25px;
            }
            /* mobile screen */
            @media (max-width: 700px) {
                .container {
                    grid-template-columns: 1fr;
                }
                .card {
                    font-size: 20px;
                    background-color: lightpink;
                }
            }
        </style>
    </head>
    <body>
        <h1>My Skills</h1>
        <div class="container">

            <div class="card">HTML</div>
            <div class="card">CSS</div>
            <div class="card">JavaScript</div>
            <div class="card">Math</div>
        </div>
    </body>
</html>
