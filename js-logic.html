<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Logic Practice</title>
    </head>
    <body>
        <h1>JavaScript Logic</h1>
        <script>
            const age = 20;
            const hasId = true;

            if (age >= 18 && hasId) {
                console.log("You can enter");
            } else {
                console.log("You cannot enter");
            }

            const day = "Monday";

            if (day === "Saturday" || day === "Friday") {
                console.log("Weekend");
            } else {
                console.log("Weekday");
            }

            const isRaining = true;
            const hasUmbrella = false;

            if (isRaining && !hasUmbrella) {
                console.log("You will get wet");
            } else {
                console.log("You are fine");
            }
        </script>
    </body>
</html>
