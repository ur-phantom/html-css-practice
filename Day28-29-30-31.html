<!DOCTYPE html>
<html>
    <head>
        <title>Day 30 - CSS Animation</title>

        <style>

            body {
                font-family: Arial;
                text-align: center;
                background-color: #f2f2f2;
            }

            h1 {
                margin: 30px;
            }

            .box {
                width: 100px;
                height: 100px;
                border-radius: 15px;
                background-color: lightgreen;
                margin: 50px auto;
                animation-delay: 1s;
                animation-direction: normal;
                animation-iteration-count: 3;
                animation-fill-mode: both;
                animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            }


            .box2 {
                width: 100px;
                height: 100px;
                border-radius: 15px;
                background-color: lightgreen;
                margin: 50px auto;
                animation-delay: 1s;
                animation-directionalte: reverse;
                animation-iteration-count: infinite;
                animation-fill-mode: backwards;
                animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1);
            }
            @keyframes moveBox {

                from {
                    transform: translateX(0);
                }

                to {
                    transform: translateX(300px);
                }
            }
        </style>
    </head>

    <body>

        <h1>Day 30 - CSS Animation</h1>

        <div class="box"></div>
        <div class="box2"></div>
    </body>
</html>
