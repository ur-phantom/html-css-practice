<!DOCTYPE html>
<html>
    <head>
        <title>Day 25 - z Index</title>

        <style>
            body {
                font-family: Arial;
                background-color: #f2f2f2;
            }

            .container {
                position: relative;
            }

            .box1 {
                width: 200px;
                height: 200px;
                background-color: red;
                position: absolute;
                top: 100px;
                left: 100px;
                z-index: 10;
            }

            .box2 {
                width: 200px;
                height: 200px;
                background-color: blue;
                position: absolute;
                top: 150px;
                left: 150px;
                z-index: 2;
            }
        </style>
    </head>

    <body>
        <div class="container">

            <div class="box1"></div>
            <div class="box2"></div>
        </div>
    </body>
</html>
