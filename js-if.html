<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Practice</title>
</head>

<body>
    <h1>Hello World</h1>
    <script>
        const age = 15;

        if (age >= 18) {
            console.log("You are an adult");
        } else {
            console.log("You are a minor");
        }

        const marks = 40;

        if (marks >= 80) {
            console.log("Grade A");
        } else if (marks >= 60) {
            console.log("Grade B");
        } else {
            console.log("Grade C");
        }

        const temperature = 35;

        if (temperature > 30) {
            console.log("It is hot");
        } else {
            console.log("It is nice");
        }
    </script>
</body>

</html>
