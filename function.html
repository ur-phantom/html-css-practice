<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Practice</title>
</head>
<body>
    <h1>JavaScript Function</h1>

    <script>
        function sayHello() {
            console.log("Hello Hasibur");
        }

        sayHello();
        sayHello();

        function greet(userName) {
            console.log("Hello " + userName);
        }

        greet("Rahim");
        greet("Karim");
        greet("Hasibur");

        function add(a, b) {
            return a + b;
        }
        const result = add(5, 3);
        console.log(result);

        function multiply(a, b) {
            return a * b;
        }
        console.log(multiply(4, 5));

        function square(n) {
            return n * n;
        }
        console.log(square(6));
    </script>
</body>
</html>
