<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Page Practice</title>
</head>

<body>
    <h1>User Info</h1>
    <p id="name">Loading...</p>
    <p id="email"></p>
    <p id="city"></p>
    <p id="phone"></p>
    <p id="company"></p>

    <script>
        const nameEl = document.querySelector("#name");
        const emailEl = document.querySelector("#email");
        const cityEl = document.querySelector("#city");
        const phoneEl = document.querySelector("#phone");
        const companyEl = document.querySelector("#company");

        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {
                nameEl.textContent = "Name: " + data.name;
                emailEl.textContent = "Email: " + data.email;
                cityEl.textContent = "City: " + data.address.city;
                phoneEl.textContent = "Phone: " + data.phone;
                companyEl.textContent = "Company: " + data.company.name;
            });
    </script>
</body>

</html>
