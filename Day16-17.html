<!DOCTYPE html>
<html>
    <head>
        <title>Day 16 - Responsive Services</title>

        <style>
            body {
                font-family: Arial;
                background-color: black;
                margin: 0;
                padding: 20px;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
                color: white;
            }
            
            .services {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 20px;
                max-width: 1000px;
                margin: auto;
            }

            .card {
                background-color: white;
                padding: 30px 20px;
                text-align: center;
                border-radius: 15px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                transition: 0.5s;
            }
            .card:hover {
                transform: translateY(-10px) scale(1.05) rotate(2deg);
                box-shadow: 0 15px 30px rgba(255, 255, 255, 0.25);
                opacity: 0.8;
            }

            .card h2 {
                margin-bottom: 10px;
            }

            .card p {
                color: #555;
            }
            
            .card button {
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                background-color: black;
                color: white;
                cursor: pointer;
                transition: 0.5s;
            }

            .card button:hover {
                background-color: gray;
            }

            .card img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                border-radius: 10px;
                transition: 0.5s;
            }

            .card img:hover {
                transform: scale(1.05);
            }
        </style>
    </head>

    <body>
        <h1>MY Services</h1>
        <div class="services">

            <div class="card">
                <h2>Web Design</h2>
                <p>Beautiful website design.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Development</h2>
                <p>Modern Website design.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Responsive</h2>
                <p>Website for all devices.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>SEO</h2>
                <p>Improve search visibility.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Typing</h2>
                <p>Fast and accurate Typing service.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Graphic Design</h2>
                <p>Creative and modern graphic design.</p>
                <img src="gpdis.webp" alt="graphic Design"
            </div>
        </div>
    
    </body>
</html>
