<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Practice</title>
</head>

<body>
    <h1>JavaScript Object</h1>
    <script>
        const person = {
            name: "Hasibur",
            age: 20,
            city: "Kushtia",
            isStudent: true
        };

        console.log(person);
        console.log(person.name);
        console.log(person.age);
        console.log(person["city"]);

        person.age = 21;
        person.email = "hassi***@gmail.com";
        console.log(person);

        console.log("My name is " + person.name);

        const students = [
            { name: "Rahim", marks: 80 },
            { name: "Karim", marks: 65 },
            { name: "Salam", marks: 79 }
        ];

        console.log(students[0].marks);
        console.log(students[1].marks);
        console.log(students[2].marks);

        for (let i = 0; i < students.length; i++) {
            if (students[i].marks >= 70) {
                console.log(students[i].name);
            }
        }

        const me = {
            name: "Hasibur Rahman",
            age: 21,
            city: "Kushtia",
            skills: ["HTML", "CSS", "Git"]
        };

        console.log(me);
        console.log(me.name);
        console.log(me.age);
        console.log(me.skills[0]);
    </script>
</body>

</html>
