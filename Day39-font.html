<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Font Practice</title>
        <style>
            .arial {
                font-family: Arial, sans-serif;
            }
            .georgia {
                font-family: Georgia, serif;
            }
            .mono {
                font-family: "Courier New", monospace;
            }
            .thin {
                font-weight: 300;
            }
            .normal {
                font-weight: 400;
            }
            .bold {
                font-weight: 700;
            }
            .mine {
                font-family: verdana, sans-serif;
                font-weight: 700;
            }
        </style>
    </head>

    <body>
        <p class="arial">Arial font</p>
        <p class="georgia">Georgia font</p>
        <p class="mono">Courier New font</p>
        <p class="thin">Thin text</p>
        <p class="normal">Normal text</p>
        <p class="bold">Bold text</p>
        <p class="mine">My font</p>
    </body>
</html>
