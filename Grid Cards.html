<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Cards Practice</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #eee;
                padding: 20px;
                font-family: Arial, sans-serif;
            }
            .cards {
                display: grid;
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .card {
                padding: 20px;
                background-color: white;
                border-radius: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                transition: transform 0.3s, box-shadow 0.3s;
            }
            .card:hover {
                transform: translateY(-8px);
                box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            }
            @media (min-width: 500px) {
                .cards {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (min-width: 800px) {
                .cards {
                    grid-template-columns: repeat(3, 1fr);
                }
            }
            @media (min-width: 1200px) {
                .cards {
                    grid-template-columns: repeat(4, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div class="cards">
            <div class="card">
                <h3>Development</h3>
                <p>I build simple web pages with HTML and CSS.</p>
            </div>
            <div class="card">
                <h3>Design</h3>
                <p>I like clean and colorful layouts.</p>
            </div>
            <div class="card">
                <h3>Responsive</h3>
                <p>My pages work on phone and laptop.</p>
            </div>
            <div class="card">
                <h3>SEO</h3>
                <p>I can handle SEO for websites.</p>
            </div>
        </div>
    </body>
</html>
