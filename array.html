<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Array Practice</title>
    </head>
    <body>
        <h1>JavaScript Array</h1>
        <script>
            const fruits = ["Mango", "Apple", "Banana"];

            console.log(fruits);
            console.log(fruits[0]);
            console.log(fruits[2]);
            console.log(fruits.length);

            fruits.push("Orange");
            console.log(fruits);

            for (let i = 0; i < fruits.length; i++) {
                console.log(fruits[i]);
            }

            const hobbies = ["Photograph", "Reading", "Cooking or Baking", "Gardening"];

            hobbies.push("Travelling");
            console.log(hobbies)

            for (let i = 1; i < hobbies.length; i++) {
                console.log(hobbies[i]);
            }
        </script>
    </body>
</html>
