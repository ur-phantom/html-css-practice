<!DOCTYPE html>
<html>
    <head>
        <title>Day 24 - Responsive Cards</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: Arial;
                background-color: #f2f2f2;
            }

            h1 {
                text-align: center;
                margin: 30px 0;
            }

            .container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
                padding: 20px;
            }

            .card {
                background-color: white;
                padding: 20px;
                text-align: center;
                border-radius: 15px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            }

            .card h2 {
                margin-bottom: 10px;
            }

            .card button {
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                background-color: #222;
                color: white;
                cursor: pointer;
                transition: 0.3s;
            }

            .card button:hover {
                background-color: gray;
                transform: scale(1.05);
            }

            /* Tablet */
            @media (max-width: 768px) {

                .container {
                    grid-template-columns: repeat(2, 1fr);
                }

                h1 {font-size: 24px;}

            }

            /* Mobile */
            @media (max-width: 500px) {

                .container {
                    grid-template-columns: 1fr;
                }

                h1 {
                    font-size: 20px;
                }
            }
        </style>
    </head>

    <body>

        <h1>My Services</h1>
        <div class="container">

            <div class="card">
                <h2>HTML</h2>
                <p>Structure of websites.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>CSS</h2>
                <p>Styling websites.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>JavaScript</h2>
                <p>Making websites interactive.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Mathematics</h2>
                <p>Logic and problem solving.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Typing</h2>
                <p>Fast and accurate typing.</p>
                <button>Learn More</button>
            </div>

            <div class="card">
                <h2>Technology</h2>
                <p>Learning modern tech.</p>
                <button>Learn More</button>
            </div>
        </div>
    </body>
</html>
