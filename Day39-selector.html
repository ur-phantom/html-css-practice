<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Selector Practice</title>
        <style>
            p {
                color: gray;
            }
            .highlight {
                color: red;
            }
            .big {
                font-size: 24px;
            }
            #special {
                color: blue;
            }
            #special2 {
                color: skyblue;
            }
            #title {
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <h1 id="title">Hello</h1>
        <p>Normal Paragraph</p>
        <p class="highlight">Special Paragraph</p>
        <p>I am learning CSS</p>
        <p class="highlight">Selectors are easy</p>
        <p>I am a student</p>
        <p class="big">Web development</p>
        <p>Normal</p>
        <p class="highlight">Highlighted</p>
        <p class="highlight" id="special">Special</p>
        <p class="highlight" id="special2">Special2</p>
        <p class="highlight" style="color: green;">Inline</p>
    </body>
</html>
