<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Layout Practice</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 30px;
                background-color: #333;
                color: white;
            }
            nav {
                display: flex;
                gap: 20px;
            }
            nav a {
                color: white;
                text-decoration: none;
            }
            main {
                padding: 15px;
                text-align: center;
                background-color: #eee;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Hasibur</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <main>
            <h2>Welcome</h2>
            <p>This is my Layout practice page.</p>
        </main>
        <footer>
            <p>&copy; 2026 Hasibur</p>
        </footer>
    </body>
</html>
